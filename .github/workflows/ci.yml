name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (derle + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Geri yükle
        run: dotnet restore SmartCityGIS.slnx

      - name: Derle
        run: dotnet build SmartCityGIS.slnx --no-restore -c Release

      # Entegrasyon testleri Testcontainers ile gerçek bir PostGIS konteyneri başlatır; GitHub'ın
      # ubuntu çalıştırıcılarında Docker hazır geldiği için ek hizmet tanımı gerekmez.
      - name: Test
        run: dotnet test SmartCityGIS.slnx --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/test-results.trx"

  frontend:
    name: Frontend (lint + test + derle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker imajları derlenebiliyor mu
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smartcity-api ./backend/SmartCityGis.Api
      - run: docker build -t smartcity-web ./frontend
