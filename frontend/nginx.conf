server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.conf;

    # API ve sağlık denetimi: dahili "api" servisine iletilir. Gerçek istemci IP'si API'ye aktarılır
    # (denetim kaydı ve giriş hız sınırı için).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;          # OpenStreetMap içe aktarma birkaç dakika sürebilir
        client_max_body_size 30m;         # GeoJSON yüklemeleri
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    # Derleme çıktıları dosya adında içerik özeti taşır; bir yıl önbelleğe alınabilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşer (React Router çözer).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
