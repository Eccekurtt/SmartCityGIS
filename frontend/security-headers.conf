# Güvenlik başlıkları. nginx'te bir konumda (location) kendi add_header'ı varsa sunucu düzeyindekiler miras alınmaz;
# bu yüzden bu dosya her ilgili konumda "include" edilir.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# CSP: betikler yalnızca kendi alanımızdan; harita karoları için üç sağlayıcıya (OpenStreetMap, OpenTopoMap, Esri) izin verilir.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.opentopomap.org https://server.arcgisonline.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
